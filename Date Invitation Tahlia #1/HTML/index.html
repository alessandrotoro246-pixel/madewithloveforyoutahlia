<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Your Letter 💌</title>
    <link rel="stylesheet" href="../style.css" />
</head>
<body class="index-page">
    <main class="envelope-scene">
        <button class="envelope-button" type="button" aria-label="Open the invitation envelope">
            <span class="envelope-shell"></span>
            <span class="envelope-paper"></span>
            <span class="envelope-flap"></span>
            <span class="envelope-seal">💖</span>
        </button>
        <h1 class="envelope-label">Your Special Letter Awaits 💌</h1>
        <p class="envelope-prompt">Tap to open your letter ✨</p>
    </main>

    <script src="../script.js"></script>
</body>
</html>
